      darkMode: 'class',

        extend: {
          colors: {
            abyss: '#02060D',

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #02060D;
    }

    ::-webkit-scrollbar-thumb {
      background: #0F3460;
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #00F0FF;
    }

    /* Window Drag Region for Frameless Window */
    .pywebview-drag-region {
      -webkit-app-region: drag;
      user-select: none;
    }

    .no-drag {
      -webkit-app-region: no-drag;
    }

    /* 3D Elevated Panel Shadows with Soft Ambient Cyan Aura */
    /* 3D Elevated Panel Shadows with Intense Neon Blue Glow */
    .panel-elevation {
      background: #06101E;
      border: 1px solid #0F3460;
      box-shadow: 0 12px 28px -4px #010308, 0 6px 14px -3px #010308, 0 0 20px rgba(0, 240, 255, 0.12), inset 0 1px 0 rgba(0, 240, 255, 0.25);
      border: 1px solid rgba(0, 240, 255, 0.45);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.28), 0 0 32px rgba(0, 240, 255, 0.12), 0 8px 24px -2px #010308, inset 0 1px 0 rgba(0, 240, 255, 0.5);
      transition: all 0.25s ease-in-out;
    }

    .panel-elevation:hover {
      border-color: #00F0FF;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.45), 0 0 48px rgba(0, 240, 255, 0.22), 0 10px 28px -2px #010308, inset 0 1px 0 rgba(128, 248, 255, 0.7);
    }

    .panel-recessed {
      background: #030912;
      border: 1px solid #0F3460;
      box-shadow: inset 0 2px 6px 0 #010308;
      border: 1px solid rgba(15, 52, 96, 0.9);
      box-shadow: inset 0 2px 8px 0 #010308, 0 0 8px rgba(0, 240, 255, 0.08);
    }

    /* High-Contrast Neon Text Glow Effects */
    .neon-text {
      color: #00F0FF;
      text-shadow: 0 0 8px #00F0FF, 0 0 16px rgba(0, 240, 255, 0.7), 0 0 24px rgba(0, 119, 255, 0.4);
    }

    .neon-text-ice {
      color: #80F8FF;
      text-shadow: 0 0 8px #80F8FF, 0 0 14px rgba(128, 248, 255, 0.6);
    }

    .neon-text-white {
      color: #FFFFFF;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.9), 0 0 18px rgba(0, 240, 255, 0.6);
    }

    .neon-text-alert {
      color: #FF1E42;
      text-shadow: 0 0 8px #FF1E42, 0 0 16px rgba(255, 30, 66, 0.8);
    }

    /* Radar Sweep & Tactical Blip Animations */
    @keyframes radarSweepAnim {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .radar-sweep-beam {
      transform-origin: 100px 68px;
      animation: radarSweepAnim 3.8s linear infinite;
    }

    @keyframes radarPingAnim {
      0% {
        r: 2px;
        opacity: 1;
      }
      70% {
        r: 9px;
        opacity: 0.15;
      }
      100% {
        r: 12px;
        opacity: 0;
      }
    }

    .radar-ping-ring {
      animation: radarPingAnim 2.2s ease-out infinite;
    }

    /* Chamfered 45-degree Sci-Fi Corners */
    .chamfer-panel {
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .chamfer-box {
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }

    /* Monochromatic Neon Cyan Glows */
    .cyan-glow {
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.35), inset 0 0 15px rgba(0, 240, 255, 0.15);
    }

    .ice-glow {
      box-shadow: 0 0 25px rgba(128, 248, 255, 0.4), inset 0 0 18px rgba(128, 248, 255, 0.2);
    }

    .alert-glow {
      box-shadow: 0 0 25px rgba(255, 30, 66, 0.45), inset 0 0 15px rgba(255, 30, 66, 0.25);
    }

    /* Keyframe Animations */
    @keyframes pulseBreathingIdle {

      0%,
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 14px #00F0FF);
      }

      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 26px #80F8FF);
      }
    }

    @keyframes pulseBreathingVoice {

      0%,
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 18px #00F0FF);
      }

      50% {
        transform: scale(1.15);
        filter: drop-shadow(0 0 38px #80F8FF);
      }
    }

    @keyframes circuitMarch {
      0% {
        stroke-dashoffset: 120;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes rotateClockwise {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateCounter {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }

    .anim-core-idle {
      animation: pulseBreathingIdle 3s ease-in-out infinite;
    }

    .anim-core-voice {
      animation: pulseBreathingVoice 1s ease-in-out infinite;
    }

    .anim-circuit-march {
      stroke-dasharray: 8, 12;
      animation: circuitMarch 6s linear infinite;
    }

    .anim-spin-cw-fast {
      animation: rotateClockwise 10s linear infinite;
    }

    .anim-spin-ccw-fast {
      animation: rotateCounter 12s linear infinite;
    }

    .anim-spin-cw-slow {
      animation: rotateClockwise 28s linear infinite;
    }

    .anim-spin-ccw-slow {
      animation: rotateCounter 22s linear infinite;
    }

    /* Hexagon Geometry */
    .hex-cell {
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }
  </style>
</head>

    function IronManHUD() {
      // -----------------------------------------------------------------------
      // REAL-TIME SYSTEM TELEMETRY STATE
      // -----------------------------------------------------------------------
      const [telemetry, setTelemetry] = useState({
        cpu: { usage_percent: 28, logical_cores: 4, physical_cores: 2, clock_speed_ghz: 2.61 },
        memory: { total_gb: 7.85, used_gb: 6.1, free_gb: 1.75, usage_percent: 78 },

        power_battery: { present: true, percent: 99, plugged_in: true, status: "AC Power Connected" },
        uptime: "8d 14h 12m",
        os: "Windows 10 (64bit)",
        top_active_consumers: [
          { process: "Antigravity IDE.exe", total_memory_mb: 2072 },
          { process: "chrome.exe", total_memory_mb: 1559 },
          { process: "svchost.exe", total_memory_mb: 820 },
          { process: "msedgewebview2.exe", total_memory_mb: 395 }
        ]
      });

      // Smoothed Telemetry Values for 30 FPS Interpolation
      const [smoothedCpu, setSmoothedCpu] = useState(28);
      const [smoothedRam, setSmoothedRam] = useState(78);
      const [smoothedDisk, setSmoothedDisk] = useState(86);

      // Atmospheric Weather Telemetry
      const [weather, setWeather] = useState({
        city: "Kandy",
        country: "Sri Lanka",
        temp_c: "28",
        humidity: "60",
        wind_kmph: "6",
        pressure_hpa: "1014",
        visibility_km: "10",
        condition: "Atmosphere Stable",
        forecast: [
          { date: "Day 1", max_c: "28", min_c: "20", desc: "Clear" },
          { date: "Day 2", max_c: "29", min_c: "21", desc: "Partly Cloudy" },
          { date: "Day 3", max_c: "30", min_c: "20", desc: "Partly Cloudy" }
        ]
      });

      // Directives Checklist State (Strict Neon Blue Hierarchy)
      const [tacticalTab, setTacticalTab] = useState('radar'); // 'radar' | 'power' | 'defense'
  const [powerMode, setPowerMode] = useState('BALANCED');
  const [directives, setDirectives] = useState([
        { id: 1, label: "Calibrate Arc Reactor Core", done: true, priority: false },
        { id: 2, label: "Neural Bus Telemetry Sync", done: true, priority: true },
        { id: 3, label: "Subsystem Hardware Audit", done: true, priority: false },
        { id: 4, label: "Autonomous Vision Standby", done: false, priority: true }
      ]);

      // Timers & Clocks
      const [currentDate, setCurrentDate] = useState(new Date());
      const [stopwatchSeconds, setStopwatchSeconds] = useState(0);

      // Chat & Agent State (20% Column)
      const [messages, setMessages] = useState([
        {
          id: 'init',
          role: 'assistant',
          text: "[JARVIS 2.0 ONLINE]\n\nWelcome back, Mr. Ahnaf. Neural link established. Monochromatic Neon Blue HUD matrix, radial energy conduits, and hyper-detailed Arc Reactor are fully active.\n\nStanding directives:\n• Check system health\n• List running applications\n• Open Chrome / Notepad\n• Capture desktop screen",
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          tools: []
        }
      ]);
      const [input, setInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [statusText, setStatusText] = useState('SYS.ONLINE');
      const [isVisionEnabled, setIsVisionEnabled] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [speechType, setSpeechType] = useState('none');
      const [selectedModel, setSelectedModel] = useState('openai/gpt-oss-120b');
      const [availableModels, setAvailableModels] = useState(['openai/gpt-oss-120b', 'openai/gpt-oss-20b']);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      const chatEndRef = useRef(null);
      const canvasRef = useRef(null);

      // -----------------------------------------------------------------------
      // SMOOTH TELEMETRY EASING (INTERPOLATION)
      // -----------------------------------------------------------------------
      useEffect(() => {
        const easeTimer = setInterval(() => {
          const targetCpu = telemetry.cpu?.usage_percent || 0;
          const targetRam = telemetry.memory?.usage_percent || 0;
          const targetDisk = telemetry.storage_drives?.[0]?.usage_percent || 0;

          setSmoothedCpu(prev => Number((prev + (targetCpu - prev) * 0.12).toFixed(1)));
          setSmoothedRam(prev => Number((prev + (targetRam - prev) * 0.12).toFixed(1)));
          setSmoothedDisk(prev => Number((prev + (targetDisk - prev) * 0.12).toFixed(1)));
        }, 50);

        return () => clearInterval(easeTimer);
      }, [telemetry]);

      // -----------------------------------------------------------------------
      // 30 FPS FULL-SCREEN BACKGROUND ENGINE:
      // RADIAL CONDUITS + TRAVELING PULSES + ROTATING RADAR SWEEP + TACTICAL GRID
      // -----------------------------------------------------------------------
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        // Vision freeze guardrail
        window.isAnimationPaused = false;
        window.pause_animations = () => { window.isAnimationPaused = true; };
        window.resume_animations = () => { window.isAnimationPaused = false; };

        const resizeCanvas = () => {
          canvas.width = canvas.parentElement.offsetWidth;
          canvas.height = canvas.parentElement.offsetHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Constellation Particles
        const particleCount = 42;
        const particles = Array.from({ length: particleCount }, () => ({
          x: Math.random() * (canvas.width || 800),
          y: Math.random() * (canvas.height || 600),
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          radius: Math.random() * 1.5 + 0.8,
          alpha: Math.random() * 0.5 + 0.25
        }));

        // 30 FPS Timing Variables
        const fpsInterval = 1000 / 30;
        let lastTime = performance.now();
        let tick = 0;
        let radarAngle = 0;

        const loop = (currentTime) => {
          animationFrameId = requestAnimationFrame(loop);

          const elapsed = currentTime - lastTime;
          if (elapsed < fpsInterval) return;
          lastTime = currentTime - (elapsed % fpsInterval);

          if (window.isAnimationPaused) return;

          tick++;
          radarAngle += 0.007; // Faint 360° radar sweep

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Center coordinate of the central Arc Reactor
          const coreX = canvas.width * 0.5;
          const coreY = canvas.height * 0.46;
          const coreRadius = 170;

          // ===================================================================
          // 1. SUBTLE TACTICAL MATRIX: BLUEPRINT GRID + ROTATING RADAR SWEEP
          // ===================================================================
          // Blueprint grid lines
          ctx.strokeStyle = 'rgba(15, 52, 96, 0.2)';
          ctx.lineWidth = 1;
          for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
          }
          for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
          }

          // Faint 360° Rotating Radar Sweep Behind Reactor
          ctx.save();
          ctx.translate(coreX, coreY);
          ctx.rotate(radarAngle);
          const radarGrad = ctx.createRadialGradient(0, 0, 40, 0, 0, 380);
          radarGrad.addColorStop(0, 'rgba(0, 240, 255, 0.08)');
          radarGrad.addColorStop(0.5, 'rgba(0, 119, 255, 0.04)');
          radarGrad.addColorStop(1, 'rgba(2, 6, 13, 0)');
          ctx.fillStyle = radarGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, 380, 0, Math.PI * 0.45);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          // ===================================================================
          // 2. RADIAL CONDUIT LINES CONNECTING ARC REACTOR TO EVERY SURROUNDING PANEL
          // ===================================================================
          const conduitPaths = [
            // Left Panel 1: Date & Time Dial (Top Card)
            [
              { x: coreX - coreRadius, y: coreY - 65 },
              { x: coreX - 250, y: coreY - 65 },
              { x: coreX - 330, y: 88 },
              { x: 250, y: 88 }
            ],
            // Left Panel 2: Storage Drive (Card 2)
            [
              { x: coreX - coreRadius, y: coreY - 25 },
              { x: coreX - 260, y: coreY - 25 },
              { x: 250, y: 195 }
            ],
            // Left Panel 3: Active Tasks (Card 3)
            [
              { x: coreX - coreRadius, y: coreY + 15 },
              { x: coreX - 250, y: coreY + 15 },
              { x: coreX - 310, y: 295 },
              { x: 250, y: 295 }
            ],
            // Left Panel 4: System Diagnostics (Card 4)
            [
              { x: coreX - coreRadius, y: coreY + 55 },
              { x: coreX - 230, y: 380 },
              { x: 250, y: 380 }
            ],
            // Left Panel 5: Directives Checklist (Card 5 - Left Side)
            [
              { x: coreX - coreRadius, y: coreY + 90 },
              { x: coreX - 240, y: 460 },
              { x: 250, y: 460 }
            ],
            // Right Panel 1: Atmosphere Weather Matrix (Top Right Card)
            [
              { x: coreX + coreRadius, y: coreY - 45 },
              { x: coreX + 250, y: coreY - 45 },
              { x: coreX + 310, y: 120 },
              { x: canvas.width - 235, y: 120 }
            ],
            // Right Panel 2: Tactical Radar & Defense Matrix (Center Right Card)
            [
              { x: coreX + coreRadius, y: coreY + 30 },
              { x: coreX + 230, y: coreY + 30 },
              { x: coreX + 290, y: 310 },
              { x: canvas.width - 235, y: 310 }
            ],
            // Right Panel 3: Honeycomb Matrix & Lower Telemetry
            [
              { x: coreX + coreRadius, y: coreY + 75 },
              { x: coreX + 250, y: 440 },
              { x: canvas.width - 235, y: 440 }
            ],
            // Bottom Panel 1: Network & RAM Gauges
            [
              { x: coreX - 85, y: coreY + coreRadius },
              { x: coreX - 85, y: coreY + 220 },
              { x: coreX - 240, y: canvas.height - 70 }
            ],
            // Bottom Panel 2: CPU & Mission Clock Gauges
            [
              { x: coreX + 85, y: coreY + coreRadius },
              { x: coreX + 85, y: coreY + 220 },
              { x: coreX + 240, y: canvas.height - 70 }
            ],
            // Terminal Sidebar Conduit
            [
              { x: coreX + coreRadius, y: coreY },
              { x: canvas.width - 20, y: coreY }
            ]
          ];

          // Draw each conduit line
          for (let c = 0; c < conduitPaths.length; c++) {
            const pts = conduitPaths[c];
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let p = 1; p < pts.length; p++) {
              ctx.lineTo(pts[p].x, pts[p].y);
            }
            ctx.strokeStyle = 'rgba(15, 52, 96, 0.7)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Trace highlight
            ctx.strokeStyle = 'rgba(0, 119, 255, 0.35)';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // =================================================================
            // 3. TRAVELING ENERGY LIGHT PACKETS WITH TRAILING GLOW TAILS
            // =================================================================
            // Calculate total path length
            let totalLen = 0;
            const segLens = [];
            for (let p = 0; p < pts.length - 1; p++) {
              const dx = pts[p + 1].x - pts[p].x;
              const dy = pts[p + 1].y - pts[p].y;
              const segLen = Math.sqrt(dx * dx + dy * dy);
              segLens.push(segLen);
              totalLen += segLen;
            }

            // Animate 2 photons per conduit
            for (let ph = 0; ph < 2; ph++) {
              const travelProgress = ((tick * 1.8 + c * 35 + ph * (totalLen * 0.5)) % totalLen);
              let acc = 0;
              let px = pts[0].x;
              let py = pts[0].y;
              let segDirX = 0;
              let segDirY = 0;

              for (let p = 0; p < segLens.length; p++) {
                if (acc + segLens[p] >= travelProgress) {
                  const segT = (travelProgress - acc) / segLens[p];
                  px = pts[p].x + (pts[p + 1].x - pts[p].x) * segT;
                  py = pts[p].y + (pts[p + 1].y - pts[p].y) * segT;
                  segDirX = (pts[p + 1].x - pts[p].x) / segLens[p];
                  segDirY = (pts[p + 1].y - pts[p].y) / segLens[p];
                  break;
                }
                acc += segLens[p];
              }

              // Photon trailing glow tail
              for (let t = 1; t <= 4; t++) {
                const tailX = px - segDirX * (t * 4);
                const tailY = py - segDirY * (t * 4);
                ctx.beginPath();
                ctx.arc(tailX, tailY, Math.max(0.5, 2 - t * 0.4), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 240, 255, ${0.4 / t})`;
                ctx.fill();
              }

              // Bright Photon Head
              ctx.beginPath();
              ctx.arc(px, py, 2.2, 0, Math.PI * 2);
              ctx.fillStyle = '#80F8FF';
              ctx.shadowColor = '#00F0FF';
              ctx.shadowBlur = 8;
              ctx.fill();
              ctx.shadowBlur = 0;
            }
          }

          // ===================================================================
          // 4. NEURAL WEB PARTICLES & INTER-NODE FILAMENTS
          // ===================================================================
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;

            // Direct link to core if near
            const dxC = p.x - coreX;
            const dyC = p.y - coreY;
            const distC = Math.sqrt(dxC * dxC + dyC * dyC);
            if (distC < 320 && distC > 180) {
              const linkA = 0.28 * (1 - distC / 320);
              ctx.beginPath();
              ctx.moveTo(coreX + (dxC / distC) * coreRadius, coreY + (dyC / distC) * coreRadius);
              ctx.lineTo(p.x, p.y);
              ctx.strokeStyle = `rgba(0, 240, 255, ${linkA})`;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }

            // Draw particle
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 240, 255, ${p.alpha})`;
            ctx.fill();

            // Inter-particle links
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p.x - p2.x;
              const dy = p.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 85) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(0, 240, 255, ${0.14 * (1 - dist / 85)})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();
              }
            }
          }
        };

        animationFrameId = requestAnimationFrame(loop);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', resizeCanvas);
        };

                          <div className="flex justify-between items-center text-coolSteel">
                            <span>DEFLECTOR SHIELD:</span>
                            <strong className="neon-text font-bold">PHASE 4 ACTIVE</strong>
                          </div>
                          <div className="flex justify-between items-center text-coolSteel border-t border-structuralBlue/50 pt-1 mt-1">
                            <span>AUTO-REPAIR MATRIX:</span>
                            <strong className="text-slateWhite font-bold">STANDBY</strong>
                          </div>
                        </div>

                        <button
                          onClick={() => {
                            setMessages(prev => [
                              ...prev,
                              {
                                id: Date.now().toString(),
                                role: 'assistant',
                                text: '[DEFENSE PROTOCOL] Nano-particle deflector shield harmonic frequency re-synchronized at 1.21 GW.',
                                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                              }
                            ]);
                          }}
                          className="w-full py-1 text-center font-bold text-[8px] tracking-wider rounded border border-structuralBlue bg-elevatedNavy text-iceBlue hover:border-electricCyan hover:bg-electricCyan/10 transition-colors uppercase"
                        >
                          RE-SYNCHRONIZE SHIELDS
                        </button>
                      </div>
                    )}

                  </div>

                  {/* Hexagonal Honeycomb Matrix */}
                  <div className="flex flex-col items-end pointer-events-none opacity-85 pt-0.5">
                    <div className="flex space-x-1">
                      <div className="w-4 h-4 hex-cell border border-structuralBlue bg-elevatedNavy"></div>
                      <div className="w-4 h-4 hex-cell border border-electricCyan bg-electricCyan/20"></div>
                      <div className="w-4 h-4 hex-cell border border-structuralBlue bg-elevatedNavy"></div>
                    </div>
                    <div className="flex space-x-1 -mt-0.5 mr-2">
                      <div className="w-4 h-4 hex-cell border border-iceBlue bg-iceBlue/30"></div>
                      <div className="w-4 h-4 hex-cell border border-structuralBlue bg-elevatedNavy"></div>
                      <div className="w-4 h-4 hex-cell border border-electricCyan bg-electricCyan/70"></div>
                      <div className="w-4 h-4 hex-cell border border-structuralBlue bg-elevatedNavy"></div>
                    </div>
                  </div>

                </div>

              </div>

              {/* 3. BOTTOM LIVE CIRCULAR TELEMETRY GAUGES (EASED 30 FPS) */}
              <div className="grid grid-cols-4 gap-2 z-10 px-2 py-1.5 border-t border-structuralBlue bg-abyss/95">

                {/* Gauge 1: Network & Uplink Dial */}
                <div className="flex items-center space-x-2.5 p-1.5 rounded panel-elevation">
                  <div className="relative w-11 h-11 flex items-center justify-center flex-shrink-0">
                    <div className="w-11 h-11 rounded-full border border-dashed border-electricCyan/60 flex items-center justify-center"></div>
                    <span className="text-[8px] font-bold text-electricCyan absolute neon-text">NET</span>
                  </div>
                  <div className="leading-tight">
                    <span className="text-[8px] text-coolSteel block">NET UPLINK</span>
                    <span className="font-bold text-[10px] neon-text">▲ 8.7 KB/s</span>
                    <span className="font-bold text-[10px] block neon-text-ice">▼ 12.4 KB/s</span>
                    <span className="text-[8px] text-coolSteel block">192.168.1.105</span>
                  </div>
                </div>

                {/* Gauge 2: Real-time RAM Memory % Arc (Eased Interpolation) */}
                <div className={`flex items-center space-x-2.5 p-1.5 rounded panel-elevation ${isRamCritical ? 'border-crimsonWarning alert-glow' : ''}`}>
                  <div className="relative w-11 h-11 flex items-center justify-center flex-shrink-0">
                    <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                      <circle cx="18" cy="18" r="14" fill="none" stroke="#0F3460" strokeWidth="3" />
                      <circle
                        cx="18" cy="18" r="14" fill="none"
                        stroke={isRamCritical ? '#FF1E42' : '#00F0FF'}
                        strokeWidth="3"
                        strokeDasharray="88"
                        strokeDashoffset={88 - (88 * smoothedRam) / 100}
                        strokeLinecap="round"
                        className="transition-all duration-300"
                      />
                    </svg>
                    <span className={`absolute text-[9px] font-bold ${isRamCritical ? 'neon-text-alert' : 'neon-text-white'}`}>
                      {smoothedRam}%
                    </span>
                  </div>
                  <div className="leading-tight">
                    <span className="text-[8px] text-coolSteel block">RAM MEMORY</span>
                    <span className="text-slateWhite font-bold text-[10px]">{telemetry.memory?.used_gb} / {telemetry.memory?.total_gb} GB</span>
                    <span className={`text-[8px] block ${isRamCritical ? 'text-crimsonWarning font-bold' : 'text-iceBlue'}`}>
                      {isRamCritical ? 'CRITICAL LOAD' : 'STATUS: OPTIMAL'}
                    </span>
                  </div>
                </div>

                {/* Gauge 3: Real-time CPU Load % Arc (Eased Interpolation) */}
                <div className={`flex items-center space-x-2.5 p-1.5 rounded panel-elevation ${isCpuCritical ? 'border-crimsonWarning alert-glow' : ''}`}>
                  <div className="relative w-11 h-11 flex items-center justify-center flex-shrink-0">
                    <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                      <circle cx="18" cy="18" r="14" fill="none" stroke="#0F3460" strokeWidth="3" />
                      <circle
                        cx="18" cy="18" r="14" fill="none"
                        stroke={isCpuCritical ? '#FF1E42' : '#00F0FF'}
                        strokeWidth="3"
                        strokeDasharray="88"
                        strokeDashoffset={88 - (88 * smoothedCpu) / 100}
                        strokeLinecap="round"
                        className="transition-all duration-300"
                      />
                    </svg>
                    <span className={`absolute text-[9px] font-bold ${isCpuCritical ? 'neon-text-alert' : 'neon-text-white'}`}>
                      {smoothedCpu}%
                    </span>
                  </div>
                  <div className="leading-tight">
                    <span className="text-[8px] text-coolSteel block">CPU LOAD</span>
                    <span className="text-slateWhite font-bold text-[10px]">{telemetry.cpu?.clock_speed_ghz} GHz</span>
                    <span className={`text-[8px] block ${isCpuCritical ? 'text-crimsonWarning font-bold' : 'text-coolSteel'}`}>
                      {telemetry.cpu?.logical_cores} Cores Active
                    </span>
                  </div>
                </div>

                {/* Gauge 4: Mission Clock & Audio Controls */}
                <div className="flex items-center space-x-2.5 p-1.5 rounded panel-elevation">
                  <div className="relative w-11 h-11 flex items-center justify-center flex-shrink-0">
                    <div className="w-11 h-11 rounded-full border border-structuralBlue flex items-center justify-center">
                      <div className="w-7 h-7 rounded-full border border-dashed border-electricCyan/50"></div>
                    </div>
                    <span className="text-[8px] font-bold text-electricCyan absolute neon-text">HUD</span>
                  </div>
                  <div className="leading-tight flex-1">
                    <div className="flex justify-between items-center">
                      <span className="text-[8px] text-coolSteel">MISSION CLOCK</span>
                      <span className="font-bold text-[10px] neon-text-ice">{formatStopwatch(stopwatchSeconds)}</span>
                    </div>
                    <div className="flex items-center space-x-2 mt-0.5 text-electricCyan text-[9px]">
                      <span className="cursor-pointer hover:text-white" title="Previous">⏮</span>
                      <span className="cursor-pointer hover:text-white" onClick={handleStopSpeech} title="Pause Audio">⏸</span>
                      <span className="cursor-pointer hover:text-white" title="Next">⏭</span>
                      <span className="text-[8px] text-iceBlue truncate font-bold">AUDIO ENGINE</span>
                    </div>
                  </div>
                </div>

              </div>

            </div>


            {/* =============================================================== */}
            {/* 20% SCREEN: DEDICATED ELEVATED CYBER CHAT TERMINAL              */}
            {/* =============================================================== */}
            <div className="w-[20%] min-w-[270px] h-full flex flex-col bg-elevatedNavy border-l border-structuralBlue relative z-20 shadow-2xl">

              {/* Top Chat Header */}
              <div className="px-3 py-2 border-b border-structuralBlue flex items-center justify-between bg-recessedDark font-mono text-xs">
                <div className="flex items-center space-x-2">
                  <div className="w-2 h-2 rounded-full bg-electricCyan animate-ping"></div>
                  <span className="font-bold text-electricCyan tracking-wider neon-text">TERMINAL</span>
                  <span className="text-[9px] text-coolSteel font-normal">[{statusText}]</span>
                </div>

                <div className="flex items-center space-x-1">
                  {/* Vision Mode Toggle */}
                  <button
                    onClick={handleToggleVision}
                    title="Toggle Vision Mode"
                    className={`text-[9px] px-1.5 py-0.5 rounded border transition flex items-center space-x-1 ${isVisionEnabled
                      ? 'bg-electricCyan/20 border-electricCyan text-iceBlue font-bold shadow-[0_0_8px_#00F0FF]'
                      : 'bg-abyss border-structuralBlue text-coolSteel'
                      }`}
                  >
                    <Icons.Eye />
                    <span>{isVisionEnabled ? 'VIS:ON' : 'VIS:OFF'}</span>
                  </button>

                  {/* Settings Gear */}
                  <button
                    onClick={() => setIsSettingsOpen(true)}
                    className="p-1 rounded bg-abyss border border-structuralBlue text-coolSteel hover:text-electricCyan hover:border-electricCyan transition"
                  >
                    <Icons.Settings />
                  </button>
                </div>
              </div>

              {/* Model Selector Bar */}
              <div className="px-3 py-1 border-b border-structuralBlue bg-abyss flex items-center justify-between text-[9px] font-mono">
                <span className="text-coolSteel">ENGINE:</span>
                <select
                  value={selectedModel}
                  onChange={(e) => setSelectedModel(e.target.value)}
                  className="bg-transparent text-electricCyan border-none outline-none cursor-pointer text-[9px] font-bold"
                >
                  {availableModels.map(m => (
                    <option key={m} value={m} className="bg-abyss text-slateWhite">
                      {m.split('/').pop()}
                    </option>
                  ))}
                </select>
              </div>

              {/* Speaking Status Pill */}
              {isSpeaking && (
                <div className="px-3 py-1 bg-elevatedNavy border-b border-electricCyan/40 flex items-center justify-between text-[9px] font-mono text-electricCyan">
                  <div className="flex items-center space-x-1.5">
                    <Icons.Volume />
                    <span>VOICE BROADCAST ACTIVE</span>
                  </div>
                  <button onClick={handleStopSpeech} className="text-crimsonWarning font-bold hover:underline">STOP</button>
                </div>
              )}

              {/* Chat Messages Feed */}
              <div className="flex-1 overflow-y-auto p-2 space-y-2.5 font-sans text-xs">
                {messages.map((msg) => {
                  const isUser = msg.role === 'user';
                  const isError = msg.role === 'error';

                  if (isError) {
                    return (
                      <div key={msg.id} className="p-2 rounded bg-alertSurface border border-crimsonWarning text-crimsonWarning text-[10px] font-mono alert-glow">
                        <div className="flex items-center space-x-1 font-bold mb-0.5">
                          <Icons.Alert />
                          <span>ALERT NOTIFICATION</span>
                        </div>
                        <div>{msg.text}</div>
                      </div>
                    );
                  }

                  return (
                    <div key={msg.id} className={`flex flex-col ${isUser ? 'items-end' : 'items-start'}`}>

                      {/* Tool Event Badges */}
                      {!isUser && msg.tools && msg.tools.length > 0 && (
                        <div className="w-full mb-1 space-y-1">
                          {msg.tools.map((t, idx) => (
                            <div key={idx} className="p-1 rounded bg-recessedDark border border-structuralBlue text-[9px] font-mono text-slateWhite">
                              <div className="flex justify-between items-center font-bold">
                                <span className="text-iceBlue">EXEC: {t.tool}()</span>
                                <span className="text-electricCyan">[SUCCESS]</span>
                              </div>
                              <div className="text-coolSteel text-[8px] mt-0.5 truncate">{t.result?.message}</div>
                            </div>
                          ))}
                        </div>
                      )}

                      {/* Chat Bubble (Pure Neon Blue Surface) */}
                      <div className={`w-full rounded p-2 text-xs shadow-lg transition border ${isUser
                        ? 'bg-[#040C18] border-structuralBlue text-slateWhite'
                        : 'bg-[#07152B] border-electricCyan/50 text-slateWhite shadow-[0_4px_12px_rgba(0,0,0,0.5)]'
                        }`}>
                        <div className="flex items-center justify-between text-[8px] font-mono pb-1 mb-1 border-b border-structuralBlue">
                          <span className={`font-bold ${isUser ? 'text-iceBlue' : 'text-electricCyan'}`}>
                            {isUser ? '[OPERATOR]' : (msg.isTamil ? '[TAMIL NEURAL]' : '[JARVIS 2.0]')}
                          </span>
                          <span className="text-coolSteel">{msg.timestamp}</span>
                        </div>
                        <div className="whitespace-pre-wrap leading-relaxed text-[11px] font-sans">
                          {msg.text}
                        </div>
                      </div>

                    </div>
                  );
                })}

                {isLoading && (
                  <div className="p-2 rounded bg-recessedDark border border-structuralBlue text-electricCyan font-mono text-[9px] animate-pulse flex items-center space-x-1.5">
                    <div className="w-1.5 h-1.5 rounded-full bg-electricCyan animate-ping"></div>
                    <span>Neural analysis and execution in progress...</span>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              {/* Quick Directive Chips */}
              <div className="p-1.5 border-t border-structuralBlue bg-recessedDark flex flex-wrap gap-1 font-mono text-[9px]">
                <button
                  onClick={() => handleSendMessage('Check system health')}
                  className="px-2 py-0.5 rounded bg-elevatedNavy border border-structuralBlue text-electricCyan hover:border-electricCyan transition flex items-center space-x-1"
                >
                  <Icons.Activity />
                  <span>Health</span>
                </button>
                <button
                  onClick={() => handleSendMessage('List all running applications')}
                  className="px-2 py-0.5 rounded bg-elevatedNavy border border-structuralBlue text-slateWhite hover:border-electricCyan hover:text-electricCyan transition flex items-center space-x-1"
                >
                  <Icons.Search />
                  <span>Apps</span>
                </button>
                <button
                  onClick={() => handleSendMessage('Open Chrome')}
                  className="px-2 py-0.5 rounded bg-elevatedNavy border border-structuralBlue text-slateWhite hover:border-electricCyan hover:text-electricCyan transition flex items-center space-x-1"
                >
                  <Icons.Globe />
                  <span>Chrome</span>
                </button>
                <button
                  onClick={() => handleSendMessage('Take screenshot of desktop')}
                  className="px-2 py-0.5 rounded bg-elevatedNavy border border-structuralBlue text-iceBlue hover:border-iceBlue transition flex items-center space-x-1"
                >
                  <Icons.Camera />
                  <span>Screen</span>
                </button>
              </div>

              {/* Bottom Directive Input Dock */}
              <div className="p-1.5 border-t border-structuralBlue bg-abyss">
                <form
                  onSubmit={(e) => { e.preventDefault(); handleSendMessage(); }}
                  className="flex items-center space-x-1 bg-elevatedNavy border border-structuralBlue focus-within:border-electricCyan rounded px-2 py-1 shadow-inner"
                >
                  <Icons.Terminal />
                  <input
                    type="text"
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    placeholder="Enter directive..."
                    className="flex-1 bg-transparent text-[11px] text-slateWhite placeholder-coolSteel outline-none font-sans ml-1"
                    disabled={isLoading}
                  />
                  <button
                    type="submit"
                    disabled={isLoading || !input.trim()}
                    className="p-1 rounded bg-electricCyan/20 border border-electricCyan text-electricCyan text-xs font-mono font-bold hover:bg-electricCyan/30 disabled:opacity-30 transition"
                    title="Execute Directive"
                  >
                    <Icons.Send />
                  </button>
                </form>
              </div>

            </div>

          </div>


          {/* ================================================================= */}
          {/* SETTINGS DIALOG MODAL (SOLID LAYERED DEPTH)                       */}
          {/* ================================================================= */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-md rounded panel-elevation chamfer-box p-4 space-y-3 font-mono text-xs text-slateWhite shadow-2xl">
                <div className="flex justify-between items-center border-b border-structuralBlue pb-2 text-electricCyan font-bold">
                  <span>CONFIGURATION MATRIX</span>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-coolSteel hover:text-white">✕</button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-coolSteel block mb-1">Groq API Key</label>
                    <input
                      type="password"
                      placeholder="gsk_..."
                      onChange={(e) => fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ groq_api_key: e.target.value }) })}
                      className="w-full p-1.5 rounded panel-recessed border border-structuralBlue focus:border-electricCyan outline-none text-xs text-slateWhite"
                    />
                  </div>

                  <div>
                    <label className="text-coolSteel block mb-1">Telegram Bot Token</label>
                    <input
                      type="password"
                      placeholder="Token from @BotFather"
                      onChange={(e) => fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ telegram_token: e.target.value }) })}
                      className="w-full p-1.5 rounded panel-recessed border border-structuralBlue focus:border-electricCyan outline-none text-xs text-slateWhite"
                    />
                  </div>

                  <div className="pt-2 border-t border-structuralBlue flex justify-end">
                    <button
                      onClick={() => setIsSettingsOpen(false)}
                      className="px-3 py-1 rounded bg-electricCyan/20 border border-electricCyan text-electricCyan font-bold hover:bg-electricCyan/30"
                    >
                      Done
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<IronManHUD />);
  </script>
</body>

</html>
